    es_es: |
      **Subss**

      Subtítulos automáticos y traducción con IA para tu biblioteca Jellyfin.

      Subss lee Jellyfin, encuentra los títulos a los que les falta alguno de los idiomas que marcaste y baja subtítulos de los mismos tipos de sitios que usa Bazarr. También puedes traducir (de→a) con Gemini; si el origen es solo imagen embebida (DVDSUB/PGS), primero baja un .srt de texto. No es un plugin de Jellyfin. Jellyfin solo entrega la lista y recibe el archivo ya bajado.

      Abre el panel para elegir idiomas, escanear títulos, traducir los marcados y revisar las coincidencias que no fueron exactas.

      **Cómo empezar**
      1. Crea una API key en Jellyfin (Dashboard → API Keys).
      2. Mapea `/media` del contenedor a la misma carpeta de biblioteca que usa Jellyfin.
      3. Abre el panel y pon la URL de Jellyfin con la IP del NAS (no localhost), la API key y los idiomas.
      4. Activa los proveedores que quieras. Varios funcionan sin cuenta.
      5. Opcional: Ajustes → Traducir → API key de Gemini (y TMDB para nombres de personaje).

      **Precauciones**
      - Esta app baja subtítulos y los sube a Jellyfin. Un idioma mal marcado puede dejar la pista equivocada.
      - Mapea solo la carpeta de medios que Jellyfin ya usa.
      - Revisa en el panel las coincidencias que no fueron exactas antes de dejarlas instaladas.
      - No expongas el puerto 8787 a internet. El panel no tiene login.

      **Aviso**
      Este software se ofrece “tal cual”, sin garantías, en la medida que permita la ley. Tú eres responsable de la configuración, la API key de Jellyfin, los volúmenes y las copias de seguridad.

      Subss es un proyecto independiente y no está afiliado ni respaldado por Jellyfin ni CasaOS.
