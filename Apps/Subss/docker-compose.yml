name: jellyfin-subss
services:
  subss:
    image: ghcr.io/sergioavila/jellyfin-subss:1.2.0
    container_name: subss
    restart: unless-stopped
    labels:
      icon: https://cdn.jsdelivr.net/gh/sergioavila/jellyfin-subss@main/Apps/Subss/icon.png
    network_mode: bridge
    environment:
      TZ: $TZ
      DATA_DIR: /data
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /data
      - type: bind
        source: /DATA/Media
        target: /media
    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: Timezone
            en_US: Timezone
            es_es: Zona horaria
            es_ES: Zona horaria
        - container: DATA_DIR
          description:
            en_us: App config directory
            en_US: App config directory
            es_es: Configuración de Subss
            es_ES: Configuración de Subss
      ports:
        - container: "8787"
          description:
            en_us: Web panel
            en_US: Web panel
            es_es: Panel web
            es_ES: Panel web
      volumes:
        - container: /data
          description:
            en_us: Subss database and settings
            en_US: Subss database and settings
            es_es: Base y ajustes de Subss
            es_ES: Base y ajustes de Subss
        - container: /media
          description:
            en_us: Same media folder Jellyfin uses (needed for timing sync)
            en_US: Same media folder Jellyfin uses (needed for timing sync)
            es_es: La misma carpeta de medios que usa Jellyfin (hace falta para sincronizar)
            es_ES: La misma carpeta de medios que usa Jellyfin (hace falta para sincronizar)
x-casaos:
  id: app.sergioavila.jellyfin-subss
  architectures:
    - amd64
    - arm64
  main: subss
  index: /
  port_map: "8787"
  scheme: http
  title:
    en_us: Subss
    en_US: Subss
    es_es: Subss
    es_ES: Subss
  tagline:
    en_us: Auto subtitles and AI translation for Jellyfin
    en_US: Auto subtitles and AI translation for Jellyfin
    es_es: Subtítulos automáticos y traducción IA para Jellyfin
    es_ES: Subtítulos automáticos y traducción IA para Jellyfin
  description:
    en_us: |
      **Subss**

      Auto subtitles and AI translation for your Jellyfin library.

      Subss reads Jellyfin, finds titles missing the languages you marked, and downloads subtitles from the same kind of sites Bazarr uses. You can also translate a track (from→to) with Gemini; if the source is only an image embed (DVDSUB/PGS), Subss downloads a text .srt first. It is not a Jellyfin plugin. Jellyfin only lists the library and receives the finished file.

      Open the web panel to pick languages, scan selected titles, translate marked titles, and review matches that were not exact.

      **Getting started**
      1. Create an API key in Jellyfin (Dashboard → API Keys).
      2. Map the container’s `/media` directory to the same library folder Jellyfin uses.
      3. Open the panel and set the Jellyfin URL to your NAS IP (not localhost), the API key, and the languages you want.
      4. Enable the providers you want. Several work without an account.
      5. Optional: Settings → Translate → Gemini API key (and TMDB for character names).

      **Important precautions**
      - This app downloads subtitle files and uploads them into Jellyfin. Wrong language settings can attach the wrong track.
      - Only map the media folder Jellyfin already uses. Avoid granting access to unrelated files.
      - Review non-exact matches in the panel before leaving them installed.
      - Do not expose port 8787 to the internet. The panel has no login.

      **Disclaimer**
      This software is provided “as is,” without warranties of any kind, to the extent permitted by applicable law. You are responsible for your configuration, Jellyfin API key, directory mappings, and backups.

      Subss is an independent project and is not affiliated with or endorsed by Jellyfin or CasaOS.
